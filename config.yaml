# Comic-Days 监控配置

# 要监控的漫画列表
# 支持三种格式:
#   1. series_id: "3269632237268447047"
#   2. url: "https://comic-days.com/series/3269632237268447047"
#   3. url: "https://comic-days.com/episode/2551460909710194586" (会自动提取series_id)
comics:
  # 直接粘贴 URL
  - url: "https://comic-days.com/series/3269632237268447047"
    name: "雨夜の月"
    enabled: true
  
  # 或者用 episode 链接
  # - url: "https://comic-days.com/episode/2551460909710194586"
  #   name: "某漫画"
  #   enabled: true

# 监控设置
monitor:
  # 检查间隔 (cron 表达式或小时数)
  interval_hours: 6
  
  # 只下载最新N话 (0 = 全部)
  latest_only: 1
  
  # 下载目录
  download_dir: "./downloads"
  
  # 状态文件目录
  state_dir: "./states"

# 账号池配置
accounts:
  # accounts.json 文件路径 (相对于此配置文件)
  file: "./accounts.json"
  
  # 最大使用账号数 (0 = 全部)
  max_accounts: 0
  
  # 并发数
  workers: 3

# 日志配置
logging:
  # 日志级别: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  
  # 日志文件
  file: "./monitor.log"
  
  # 控制台输出
  console: true
